# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: playit
arch: ${PLAYIT_NFPM_ARCH}
platform: linux
version: ${PLAYIT_VERSION}
version_schema: semver
release: ${PLAYIT_PACKAGE_RELEASE}
section: net
priority: optional
maintainer: Patrick Lorio <patrick@playit.gg>
description: Making it easy to play games with friends. Makes your server public
homepage: https://playit.gg
license: BSD-2-Clause
depends:
  - logrotate
overrides:
  # window:start
  # The desktop window's libraries. Recommended rather than required, so servers can skip
  # them with --no-install-recommends; desktops already have them.
  deb:
    recommends:
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libvulkan1
      - libwayland-client0
  rpm:
    recommends:
      - libxcb.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libvulkan.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
  # window:end
  apk:
    depends:
      - logrotate
      - "!playit-openrc"
      # window:start
      # The window's libraries. apk has no optional dependencies; these are small.
      - so:libxcb.so.1
      - so:libxkbcommon.so.0
      - so:libxkbcommon-x11.so.0
      - so:libvulkan.so.1
      - so:libwayland-client.so.0
      # window:end
contents:
  - src: ${PLAYIT_CLI_BIN}
    dst: /opt/playit/agent
    expand: true
    file_info:
      mode: 0755
  - src: ${PLAYITD_BIN}
    dst: /opt/playit/playitd
    expand: true
    file_info:
      mode: 0755
  - src: ./linux/playit
    dst: /opt/playit/playit
    file_info:
      mode: 0755
  - src: /opt/playit/playit
    dst: /usr/bin/playit
    type: symlink
  - src: /opt/playit/playitd
    dst: /usr/bin/playitd
    type: symlink
  - src: ./linux/logrotate.conf
    dst: /etc/logrotate.d/playit
    file_info:
      mode: 0644
  - src: ./linux/playit.sysusers
    dst: /usr/lib/sysusers.d/playit.conf
    file_info:
      mode: 0644
  - src: ./linux/playit.service
    dst: /usr/lib/systemd/system/playit.service
    file_info:
      mode: 0644
  - src: ./linux/playit.service
    dst: /opt/playit/share/init/systemd/playit.service
    file_info:
      mode: 0644
  - src: ./linux/playit.openrc
    dst: /opt/playit/share/init/openrc/playit
    file_info:
      mode: 0755
  - dst: /etc/playit
    type: dir
    file_info:
      mode: 0750
      owner: playit
      group: playit
  # window:start (the desktop window, on amd64 and arm64; see package-linux-nfpm.sh)
  - src: ${PLAYIT_GUI_BIN}
    dst: /opt/playit/playit-gui
    expand: true
    file_info:
      mode: 0755
  - src: /opt/playit/playit-gui
    dst: /usr/bin/playit-gui
    type: symlink
  - src: ./linux/gg.playit.gui.desktop
    dst: /usr/share/applications/gg.playit.gui.desktop
    file_info:
      mode: 0644
  - src: ./linux/icons/gg.playit.gui-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/gg.playit.gui.png
    file_info:
      mode: 0644
  - src: ./linux/icons/gg.playit.gui-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/gg.playit.gui.png
    file_info:
      mode: 0644
  - src: ./linux/icons/gg.playit.gui-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/gg.playit.gui.png
    file_info:
      mode: 0644
  - src: ./linux/icons/gg.playit.gui-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/gg.playit.gui.png
    file_info:
      mode: 0644
  - src: ./packages/playit-gui/assets/images/app-icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/gg.playit.gui.png
    file_info:
      mode: 0644
  # window:end
scripts:
  preinstall: ./build-scripts/nfpm/preinstall.sh
  postinstall: ./build-scripts/nfpm/postinstall.sh
  preremove: ./build-scripts/nfpm/preremove.sh
  postremove: ./build-scripts/nfpm/postremove.sh
