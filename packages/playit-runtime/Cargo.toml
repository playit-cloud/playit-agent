[package]
name = "playit-runtime"
version.workspace = true
edition = "2024"
description = "Application ports and runtime adapters for playit"
license = "BSD-2-Clause"
repository = "https://github.com/playit-cloud/playit-agent"

[features]
default = ["application"]
application = [
    "dep:async-trait",
    "dep:hex",
    "dep:playit-api-client",
    "dep:playit-agent-core",
    "dep:playit-model",
    "dep:playit-platform",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-util",
    "dep:toml",
    "dep:tracing",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
hex = { workspace = true, optional = true }
playit-api-client = { path = "../api_client", version = "0.2.0", optional = true }
playit-agent-core = { path = "../agent_core", version = "1.0.10", optional = true }
playit-model = { path = "../playit-model", version = "1.0.10", optional = true }
playit-platform = { path = "../playit-platform", version = "1.0.10", optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }

[[example]]
name = "mtu_control"
required-features = ["application"]
