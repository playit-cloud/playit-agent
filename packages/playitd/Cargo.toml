[package]
name = "playitd"
version.workspace = true
edition = "2024"
authors = ["Patrick Lorio <patrick@playit.gg>"]
description = "Shared daemon, IPC, and service management for playit"
repository = "https://github.com/playit-cloud/playit-agent"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
governor = "0.10.0"

dotenv = "0.15.0"
interprocess = { version = "2.2", features = ["tokio"] }

playit-agent-core = { path = "../agent_core", version = "1.0.10" }
playit-ipc = { path = "../playit-ipc", version = "1.0.10" }
playit-model = { path = "../playit-model", version = "1.0.10" }
playit-platform = { path = "../playit-platform", version = "1.0.10" }
playit-runtime = { path = "../playit-runtime", version = "1.0.10" }
clap = { version = "4.6.0", features = ["derive"] }
serde_yml = "0.0.12"

[[bin]]
name = "playitd"
path = "src/bin/playitd.rs"

[[bin]]
name = "playitd-service"
path = "src/bin/playitd-service.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_Threading"] }
windows-service = "0.8.0"
tracing-rolling-file = "0.1.3"
