[package]
name = "playit-gui"
version.workspace = true
edition = "2024"
authors = ["Patrick Lorio <patrick@playit.gg>"]
description = "Desktop window for viewing and setting up the playit agent"
repository = "https://github.com/playit-cloud/playit-agent"

[[bin]]
name = "playit-gui"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

clap = { version = "4.5", features = ["derive"] }
gpui = "0.2.2"

playit-ipc = { path = "../playit-ipc", version = "1.2.0" }
playit-api-client = { path = "../api_client", version = "0.2.0" }

[dev-dependencies]
serde_json = { workspace = true }
