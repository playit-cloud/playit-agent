[package]
name = "playit-gui"
version.workspace = true
edition = "2024"
authors = ["Patrick Lorio <patrick@playit.gg>"]
description = "Desktop window for viewing and setting up the playit agent"
repository = "https://github.com/playit-cloud/playit-agent"

[[bin]]
name = "playit-gui"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
gpui = "0.2.2"

playit-ipc = { path = "../playit-ipc", version = "1.2.0" }
playitd = { path = "../playitd", version = "1.2.0" }
playit-api-client = { path = "../api_client", version = "0.2.0" }

# Compile the Metal shaders when the app starts, so building needs only the Command Line
# Tools rather than full Xcode.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
