[package]
name = "playit-cli"
version.workspace = true
edition = "2024"
authors = ["Patrick Lorio <patrick@playit.gg>"]
description = "Making it easy to play games with friends. Makes your server public"
repository = "https://github.com/playit-cloud/playit-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

uuid = { workspace = true }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde_yml = "0.0.12"
crossterm = "0.28"
ratatui = "0.29"
dotenv = "0.15.0"

playit-agent-core = { path = "../agent_core", version = "1.0.10" }
playit-ipc = { path = "../playit-ipc", version = "1.0.10" }
playit-model = { path = "../playit-model", version = "1.0.10" }
playit-platform = { path = "../playit-platform", version = "1.0.10" }
playit-runtime = { path = "../playit-runtime", version = "1.0.10" }

[target.'cfg(windows)'.dependencies]
whoami = "1.5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.wix]
culture = "en-US"
locale = "packages/playit-cli/wix/en-us.wxl"
