[package]
name = "playit-agent-core"
version.workspace = true
edition = "2024"
description = "Contains the logic to create a playit.gg agent"
license = "BSD-2-Clause"
repository = "https://github.com/playit-cloud/playit-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
hex =  { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
byteorder = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
message-encoding = { workspace = true }
playit-common = { path = "../common" }

playit-agent-proto = { path = "../agent_proto", version = "1.3.0" }
playit-api-client = { path = "../api_client", version = "0.2.0" }

governor = "0.10.0"
crossbeam = "0.8.4"
slab = "0.4.9"
slotmap = "1.1.1"

# TLS termination with Let's Encrypt certificates for HTTPS tunnels
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "client", "client-legacy"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = { version = "0.18", default-features = false }

[target."cfg(windows)".dependencies]
# Restricts the certificate directory to the current user, SYSTEM and Administrators.
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
