[package]
name = "playit-agent-core"
version.workspace = true
edition = "2024"
description = "Contains the logic to create a playit.gg agent"
license = "BSD-2-Clause"
repository = "https://github.com/playit-cloud/playit-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
hex =  { workspace = true }
uuid = { workspace = true }
byteorder = { workspace = true }
futures-util = { workspace = true }
message-encoding = { workspace = true }

playit-agent-proto = { path = "../agent_proto", version = "1.3.0" }
playit-model = { path = "../playit-model", version = "1.0.10" }

governor = "0.10.0"
crossbeam = "0.8.4"
slab = "0.4.9"
slotmap = "1.1.1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
